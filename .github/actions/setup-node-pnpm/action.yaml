name: Setup Node and pnpm
description: Install the repository's pinned Node, pnpm, and frozen dependencies

inputs:
  node-version:
    description: Node.js version used by CI
    required: false
    default: '22.23.2'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      # pnpm/action-setup v6.1.0 (pnpm 12 native bootstrap; older pins break Windows store path)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

    - name: Setup Node
      # actions/setup-node v6.5.0
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
